<style>
:root{
--bg:#fbfaf7;--s:#f2f0ea;--fg:#1a1918;--mu:#73716b;--bd:#e3e0d8;--er:#c24137;
--accent:#b89753;--radius:16px;--shadow:0 10px 30px -10px rgba(0,0,0,.05);
}
[data-theme=dark]{
--bg:#0e0e0d;--s:#161615;--fg:#f3f1ec;--mu:#94928b;--bd:#262624;--er:#e05246;
--accent:#d4af37;--shadow:0 10px 30px -10px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 'Plus Jakarta Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:'Playfair Display',serif;font-weight:500;margin:0;letter-spacing:-.01em}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;padding:16px 28px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--bg);backdrop-filter:blur(12px);background-color:rgba(251,250,247,0.85);z-index:40;transition:background-color .3s}
[data-theme=dark] .top{background-color:rgba(14,14,13,0.85)}
.brand{font-family:'Playfair Display',serif;font-weight:600;font-size:20px;letter-spacing:.02em;color:var(--accent)}
.top nav{display:flex;gap:6px;order:3;width:100%}
@media(min-width:768px){.top nav{order:0;width:auto}}
.top nav button{border:0;background:transparent;padding:8px 16px;border-radius:999px;color:var(--mu);cursor:pointer;font-weight:500;transition:all .2s}
.top nav button:hover{color:var(--fg)}
.top nav button.on{background:var(--s);color:var(--fg);box-shadow:var(--shadow)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--bd);background:transparent;border-radius:999px;padding:10px 20px;cursor:pointer;text-decoration:none;color:var(--fg);font-size:14px;font-weight:500;white-space:nowrap;transition:all .2s}
.btn:hover{border-color:var(--fg);transform:translateY(-1px)}
.btn.pri{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.pri:hover{opacity:.9}
.btn.dng{color:var(--er);border-color:var(--bd)}
.ib{border:0;background:var(--s);cursor:pointer;padding:8px 12px;border-radius:12px;display:inline-flex;align-items:center;color:var(--fg);transition:transform .2s}
.ib:hover{transform:scale(1.05)}
.wrap{max-width:1200px;margin:0 auto;padding:32px 24px 80px}
input,select{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:12px 16px;width:100%;outline:none;transition:border-color .2s}
input:focus,select:focus{border-color:var(--accent)}
input[type=checkbox]{width:auto}
input[type=range]{padding:0;accent-color:var(--accent)}
input[type=color]{height:46px;padding:4px;border-radius:12px;cursor:pointer}
.fld{margin-bottom:18px;font-size:13px;font-weight:500;color:var(--mu)}
.fld>input,.fld>select{margin-top:6px;font-size:15px;color:var(--fg)}
.mu{color:var(--mu);font-size:13px}
.err{color:var(--er);font-size:14px;min-height:22px;margin-top:4px}
.card{border:1px solid var(--bd);background:var(--s);border-radius:var(--radius);padding:24px;margin-bottom:16px;box-shadow:var(--shadow)}
.login{max-width:400px;margin:14vh auto 0;padding:0 24px}
.login h1{font-size:36px;margin-bottom:8px}
.tabs{display:flex;gap:28px;border-bottom:1px solid var(--bd);overflow-x:auto;margin:24px 0 28px}
.tabs button{border:0;background:transparent;padding:12px 0;color:var(--mu);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;font-weight:500;transition:color .2s}
.tabs button.on{color:var(--fg);border-color:var(--accent)}
.cols{display:grid;grid-template-columns:repeat(1,minmax(0,1fr));gap:20px}
@media(min-width:640px){.cols{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:1024px){.cols{grid-template-columns:repeat(3,minmax(0,1fr))}}
.col{cursor:pointer;background:var(--s);border:1px solid var(--bd);border-radius:var(--radius);overflow:hidden;transition:all .3s}
.col:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:var(--accent)}
.col .cv{aspect-ratio:16/10;overflow:hidden;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--mu);font-size:13px}
.col .cv img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.col:hover .cv img{transform:scale(1.03)}
.col-info{padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
.col b{display:block;font-family:'Playfair Display',serif;font-weight:600;font-size:18px;margin-bottom:4px}
.ah{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:10px}
.ah h1{font-size:32px}
.back{border:0;background:transparent;color:var(--mu);cursor:pointer;padding:0 0 12px;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.back:hover{color:var(--fg)}
.drop{display:block;border:2px dashed var(--bd);background:var(--s);border-radius:var(--radius);padding:40px 24px;text-align:center;cursor:pointer;transition:all .2s}
.drop:hover{border-color:var(--accent);background:var(--bg)}
.bar{height:4px;background:var(--bd);border-radius:2px;overflow:hidden;margin:16px 0}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.pg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media(min-width:768px){.pg{grid-template-columns:repeat(4,minmax(0,1fr))}}
.pt{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--s);border:1px solid var(--bd)}
.pt img{width:100%;height:100%;object-fit:cover;display:block}
.pb{position:absolute;top:8px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .2s}
.pb:hover{transform:scale(1.1)}
.tag{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);color:#fff;font-size:11px;font-weight:500;padding:3px 10px;border-radius:999px}
.item{display:flex;gap:16px;align-items:center;padding:16px 0;border-top:1px solid var(--bd)}
.item img{width:56px;height:56px;object-fit:cover;border-radius:12px;flex:none}
.av{width:56px;height:56px;border-radius:50%;background:var(--s);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-weight:600;flex:none}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.chip{border:1px solid var(--bd);border-radius:999px;padding:8px 18px;font-size:13px;font-weight:500;background:var(--s);cursor:pointer;transition:all .2s}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.stat{background:var(--s);border:1px solid var(--bd);border-radius:var(--radius);padding:20px}
.stat div:first-child{font-size:13px;font-weight:500;color:var(--mu);margin-bottom:6px}
.stat div:last-child{font-size:30px;font-family:'Playfair Display',serif;font-weight:600}
.g2{display:grid;grid-template-columns:repeat(1,minmax(0,1fr));gap:16px}
@media(min-width:768px){.g2{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pvf{border:1px solid var(--bd);border-radius:var(--radius);overflow:hidden;max-height:600px;overflow-y:auto;margin-bottom:20px;box-shadow:var(--shadow)}
canvas{width:100%;display:block}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:12px 24px;border-radius:999px;font-size:14px;font-weight:500;display:none;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,0.2)}
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.modal-box{background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:24px;padding:32px;max-width:400px;width:100%;text-align:center;box-shadow:0 25px 50px -12px rgba(0,0,0,0.25)}
.modal-box h3{margin-top:0;font-size:22px;margin-bottom:10px}
.modal-box p{color:var(--mu);font-size:15px;margin-bottom:24px;line-height:1.5}
.modal-actions{display:flex;gap:12px;justify-content:center}
/* Estilos de la galería cliente */
.g{background:var(--gbg);color:var(--gfg);font-family:var(--gfont),sans-serif;min-height:100svh;transition:background .3s,color .3s}
.g-hero{position:relative;height:var(--hh);overflow:hidden;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:32px}
.g-hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;animation:gz 1.8s cubic-bezier(0.16,1,0.3,1) both}
@keyframes gz{from{opacity:0;transform:scale(1.06)}to{opacity:1;transform:none}}
.g-hero:after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.3),rgba(0,0,0,.65))}
.g-hero>div{position:relative;z-index:1;max-width:850px}
.g-plain{text-align:center;padding:80px 24px 48px}
.g-t{font-size:clamp(36px,8vw,76px);line-height:1.1;margin:0 0 16px;font-weight:400;letter-spacing:-.01em}
.g-line{width:50px;height:2px;background:var(--gac);margin:0 auto 20px}
.g-sub{font-size:clamp(16px,2.5vw,20px);margin:0 0 32px;opacity:.9;font-style:italic;max-width:650px;margin-left:auto;margin-right:auto}
.g-plain .g-sub{margin:0 auto;color:var(--gmu)}
.g-btn{border:1px solid rgba(255,255,255,0.6);color:#fff;background:transparent;padding:14px 36px;letter-spacing:.15em;font-size:12px;cursor:pointer;font-family:inherit;text-transform:uppercase;border-radius:999px;transition:all .3s}
.g-btn:hover{background:#fff;color:#111;border-color:#fff}
.g-nav{position:sticky;top:0;z-index:30;background:var(--gbg);border-bottom:1px solid var(--gbd);display:flex;align-items:center;justify-content:space-between;padding:14px 24px;gap:12px;backdrop-filter:blur(12px)}
.g-nav b{font-weight:500;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:'Playfair Display',serif}
.g-nav>div{display:flex;gap:8px;flex:none}
.g-ib{background:transparent;border:0;color:var(--gfg);cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:8px 14px;font-family:inherit;font-size:14px;border-radius:999px;transition:background .2s}
.g-ib:hover{background:rgba(128,128,128,0.1)}
.g-ib.act{color:var(--gac)}
.g-body{padding:24px;max-width:1500px;margin:0 auto}
.g-empty{text-align:center;color:var(--gmu);padding:80px 20px;margin:0;font-style:italic}
.g-grid{--rh:220px;display:flex;flex-wrap:wrap;gap:12px}
.g-grid::after{content:"";flex-grow:9999}
.g-grid .g-i{flex:calc(var(--ar)*100) 1 calc(var(--ar)*var(--rh));min-width:0;margin:0}
.g-mas{column-count:2;column-gap:12px}
.g-big{max-width:900px;margin:0 auto;display:grid;gap:20px}
@media(min-width:768px){.g-grid{--rh:280px;gap:16px}.g-mas{column-count:3;column-gap:16px}}
@media(min-width:1200px){.g-grid{--rh:320px}.g-mas{column-count:4}}
.g-i{position:relative;overflow:hidden;background:var(--gbd);cursor:pointer;break-inside:avoid;margin-bottom:12px;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;aspect-ratio:var(--ar,1.5);border-radius:12px;transition:transform .3s}
.g-big .g-i{margin:0}
.g-i img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;-webkit-user-drag:none;opacity:0;transition:opacity .6s,transform .7s}
.g-i img.ok{opacity:1}
@media(hover:hover){.g-i:hover img{transform:scale(1.03)}}
.g-h{position:absolute;right:12px;bottom:12px;width:42px;height:42px;border-radius:50%;border:0;background:rgba(0,0,0,0.45);backdrop-filter:blur(6px);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .2s,background .2s}
.g-h:hover{transform:scale(1.1)}
.g-h.on{color:var(--gac);background:rgba(255,255,255,0.95)}
.gate{min-height:100svh;display:flex;align-items:center;justify-content:center;position:relative;padding:24px;font-family:var(--gfont),sans-serif;background:var(--gbg)}
.gate-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(16px) brightness(.65);transform:scale(1.08);pointer-events:none}
.gate-card{position:relative;background:var(--gbg);color:var(--gfg);width:100%;max-width:440px;padding:44px 36px;text-align:center;border-radius:24px;box-shadow:0 25px 50px -12px rgba(0,0,0,0.3);border:1px solid var(--gbd)}
.gate-card input{background:transparent;color:var(--gfg);border:1px solid var(--gbd);border-radius:12px;margin-bottom:14px;text-align:center;padding:14px 16px;font-family:inherit}
.gate-card input:focus{border-color:var(--gac)}
.g-solid{width:100%;border:0;background:var(--gac);color:#fff;padding:16px;letter-spacing:.1em;font-size:13px;text-transform:uppercase;cursor:pointer;font-family:inherit;border-radius:999px;font-weight:600;transition:opacity .2s}
.g-solid:hover{opacity:.9}
/* Lightbox con Zoom Interactivo */
.lb{position:fixed;inset:0;background:rgba(6,6,6,0.98);z-index:60;display:flex;flex-direction:column;color:#fff;font-family:var(--gfont),sans-serif}
.lb-top{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;background:rgba(0,0,0,0.4)}
.lb-b{background:transparent;border:0;color:#fff;cursor:pointer;padding:8px 12px;display:inline-flex;align-items:center;border-radius:8px;transition:background .2s}
.lb-b:hover{background:rgba(255,255,255,0.1)}
.lb-stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:zoom-in}
.lb-stage.zoomed{cursor:zoom-out}
.lb-stage img{max-width:100%;max-height:100%;object-fit:contain;pointer-events:none;-webkit-touch-callout:none;user-select:none;transition:transform .3s cubic-bezier(0.16,1,0.3,1);transform-origin:center}
.lb-n{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,0.5);border:0;color:#fff;width:50px;height:50px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s}
.lb-n:hover{background:rgba(0,0,0,0.8)}
.lb-p{left:16px}.lb-nx{right:16px}
.lb-bot{display:flex;gap:12px;padding:16px 24px;background:rgba(0,0,0,0.4);max-width:800px;margin:0 auto;width:100%}
.lb-bot input{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:#fff;border-radius:999px;padding:12px 20px;flex:1}
.lb-bot input:focus{border-color:#fff}
.lb-s{border:0;background:#fff;color:#111;border-radius:999px;padding:0 24px;cursor:pointer;font-family:inherit;font-weight:600;transition:opacity .2s}
.lb-s:hover{opacity:.9}
@media(prefers-reduced-motion:reduce){.g-hero>img{animation:none}.g-i img{transition:none}}
</style>

/* Procesamiento de imagen y marcas de agua /
async function decode(file){
try{return await createImageBitmap(file)}catch(e){}
const buf=new Uint8Array(await file.arrayBuffer());const starts=[];
for(let i=0;i<buf.length-3&&starts.length<12;i++){if(buf[i]===255&&buf[i+1]===216&&buf[i+2]===255)starts.push(i)}
let best=null;
for(const s of starts){
try{const bm=await createImageBitmap(new Blob([buf.subarray(s,Math.min(buf.length,s+25e6))],{type:'image/jpeg'}));
if(!best||bm.widthbm.height>best.widthbest.height)best=bm}catch(e){}
}
if(!best)throw new Error('No se pudo leer '+file.name+'. Expórtala a JPG.');
return best;
}
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.crossOrigin='anonymous';i.onload=()=>res(i);i.onerror=rej;i.src=src})}
async function mark(x,W,H,w){
const n=w.dens,rows=n2;let logo=null;
if(w.type==='png'&&w.png){try{logo=await loadImg(w.png)}catch(e){}}
x.save();x.translate(W/2,H/2);x.rotate(w.rotMath.PI/180);x.globalAlpha=w.op/100;x.textAlign='center';x.textBaseline='middle';
const bw=2W,bh=2H,cw=bw/n,ch=bh/rows;
