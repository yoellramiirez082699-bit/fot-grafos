<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#171714">
<title>Atelier — Gestión fotográfica</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f6f5f2;--panel:#fff;--ink:#24231f;--muted:#858279;--line:#e9e6df;--accent:#927b61;--soft:#eee9e1;--green:#52735c;--red:#a34d48;--shadow:0 12px 35px #27231a0b}
[data-theme=dark]{--bg:#171816;--panel:#222420;--ink:#f2f0e9;--muted:#aaa79d;--line:#383a34;--accent:#c0a98a;--soft:#33332d;--green:#8eb397;--red:#d58c85;--shadow:0 12px 35px #0003}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px 'DM Sans',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh}.hidden{display:none!important}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,var(--bg),var(--soft))}.login-card{width:min(440px,100%);background:var(--panel);padding:34px;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.brand{font:600 27px 'Playfair Display',serif;letter-spacing:.02em}.eyebrow{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}h1,h2,h3,p{margin-top:0}h1{font:500 30px 'Playfair Display',serif;margin:8px 0}h2{font:500 25px 'Playfair Display',serif;margin:0 0 6px}h3{font-size:14px;margin:0 0 12px}.muted{color:var(--muted)}.field{display:grid;gap:7px;margin:14px 0}.field label{font-size:12px;color:var(--muted)}input,select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:11px 12px;border-radius:9px;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--accent)}.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:10px 14px;font-weight:600;font-size:12px}.btn.primary{background:var(--ink);color:var(--panel);border-color:var(--ink)}.btn.soft{background:var(--soft);border-color:var(--soft)}.btn.danger{color:var(--red)}.btn:disabled{opacity:.5;cursor:not-allowed}.login-card .btn{width:100%;margin-top:8px}.shell{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.sidebar{background:var(--panel);border-right:1px solid var(--line);padding:25px 17px;display:flex;flex-direction:column;gap:28px}.side-brand{padding:0 10px}.side-brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.15em;text-transform:uppercase;margin-top:3px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;text-align:left;color:var(--muted);padding:12px;border-radius:9px;font-size:13px}.nav button.active,.nav button:hover{background:var(--soft);color:var(--ink)}.nav .ico{display:inline-block;width:26px}.side-bottom{margin-top:auto;display:grid;gap:9px}.user-mini{border-top:1px solid var(--line);padding:15px 7px 0;overflow-wrap:anywhere}.main{min-width:0;padding:30px clamp(18px,4vw,55px);max-width:1500px;width:100%;margin:0 auto}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:32px}.top-actions{display:flex;gap:8px}.page-head{display:flex;justify-content:space-between;align-items:end;gap:14px;margin-bottom:23px}.page-head p{color:var(--muted);margin:0}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:25px}.stat,.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}.stat span{color:var(--muted);font-size:11px}.stat strong{display:block;font:500 28px 'Playfair Display',serif;margin-top:8px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.project{padding:0;overflow:hidden}.cover{height:155px;background:var(--soft);overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover}.project-info{padding:15px}.project-info strong{font-size:14px}.project-info small{display:block;color:var(--muted);margin-top:6px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.stack{display:grid;gap:13px}.empty{padding:45px 20px;text-align:center;border:1px dashed var(--line);border-radius:13px;color:var(--muted)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:17px}.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:12px}.photo{position:relative;border-radius:11px;overflow:hidden;background:var(--soft);aspect-ratio:4/3}.photo img{width:100%;height:100%;object-fit:cover}.photo .wm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:white;text-shadow:0 1px 5px #000;font-weight:700;letter-spacing:.12em;pointer-events:none;transform:rotate(-25deg)}.photo-meta{font-size:11px;color:var(--muted);padding:7px 2px}.badge{font-size:10px;background:var(--soft);padding:5px 8px;border-radius:30px;color:var(--muted)}.preview-box{background:var(--soft);padding:12px;border-radius:12px}.preview-box .photo{max-width:100%;margin:auto}.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,.85fr);gap:18px}.modal-back{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:18px;z-index:20}.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.toast{position:fixed;bottom:22px;right:22px;background:var(--ink);color:var(--panel);padding:12px 16px;border-radius:10px;z-index:40;box-shadow:var(--shadow);max-width:min(420px,90vw)}.water-grid{background-image:linear-gradient(45deg,#0001 25%,transparent 25%),linear-gradient(-45deg,#0001 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#0001 75%),linear-gradient(-45deg,transparent 75%,#0001 75%);background-size:20px 20px}.client-gallery{max-width:1100px;margin:30px auto;padding:20px}.client-gallery .photos{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}.client-photo{background:var(--panel);border:1px solid var(--line);padding:7px;border-radius:12px}.client-photo .photo{aspect-ratio:auto}.client-photo img{display:block;width:100%;height:auto}.client-photo textarea{margin-top:7px;font-size:11px}.notice{background:var(--soft);padding:12px;border-radius:10px;color:var(--muted);font-size:12px;line-height:1.5}.progress{height:5px;background:var(--soft);border-radius:9px;overflow:hidden}.progress i{display:block;height:100%;background:var(--accent);width:0}.mobile-menu{display:none}
@media(max-width:850px){.shell{grid-template-columns:1fr}.sidebar{position:sticky;top:0;z-index:10;padding:10px 14px;border-right:0;border-bottom:1px solid var(--line);gap:8px}.side-brand{display:none}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:9px}.nav .ico{width:auto;margin-right:5px}.side-bottom{display:none}.main{padding:22px 15px}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:1fr}.topbar{margin-bottom:23px}}@media(max-width:480px){.grid{grid-template-columns:1fr}.page-head{align-items:start;flex-direction:column}.photos{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.photo{aspect-ratio:3/4}.login-card{padding:25px}}
</style>
</head>
<body>
<div id="login" class="login-wrap"><div class="login-card">
<div class="eyebrow">Tu estudio, organizado</div><div class="brand">atelier<span style="color:var(--accent)">.</span></div>
<h1>Bienvenido</h1><p class="muted">Administra sesiones, protege tus fotografías y comparte galerías privadas.</p>
<div class="field"><label>Correo electrónico</label><input id="auth-email" type="email" autocomplete="email" placeholder="tu@correo.com"></div>
<div class="field"><label>Contraseña</label><input id="auth-password" type="password" autocomplete="current-password" placeholder="••••••••"></div>
<button class="btn primary" id="sign-in">Iniciar sesión</button><button class="btn" id="sign-up">Crear cuenta de fotógrafo</button>
<p class="muted" style="font-size:11px;margin:17px 0 0">Necesitas confirmar el correo si la verificación está activada en Supabase.</p>
</div></div>
<div id="app" class="app hidden">
<div class="shell">
<aside class="sidebar"><div class="side-brand"><div class="brand">atelier<span style="color:var(--accent)">.</span></div><small>Photography workspace</small></div>
<nav class="nav" id="nav">
<button data-page="dashboard" class="active"><span class="ico">⌂</span>Resumen</button>
<button data-page="projects"><span class="ico">▦</span>Proyectos</button>
<button data-page="watermark"><span class="ico">◇</span>Marca de agua</button>
<button data-page="design"><span class="ico">✳</span>Diseño de galería</button>
<button data-page="activity"><span class="ico">♡</span>Selecciones</button>
</nav><div class="side-bottom"><button class="btn" id="theme">☾ Cambiar apariencia</button><div class="user-mini"><div id="user-email" style="font-size:12px;font-weight:600"></div><button class="btn" id="sign-out" style="margin-top:10px;width:100%">Cerrar sesión</button></div></div></aside>
<main class="main"><header class="topbar"><div><div class="eyebrow">Espacio de trabajo</div><div style="font:500 20px 'Playfair Display',serif" id="welcome">Tu estudio</div></div><div class="top-actions"><button class="btn" id="theme-mobile">☾</button><button class="btn primary" id="new-project">＋ Nuevo proyecto</button></div></header><section id="content"></section></main>
</div></div>
<div id="modal-root"></div><div id="toast" class="toast hidden"></div>
<script>
(()=>{
'use strict';
const SUPABASE_URL='https://qqocorajzmobeazsbpfc.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_skrQIOLFNMUb8H3iIYLzlw_799ZQXSB';
const BUCKET_ORIGINALS='studioflow-originals';
const BUCKET_PREVIEWS='studioflow-previews';
const TABLE_PROJECTS='projects',TABLE_PHOTOS='photos';
const $=id=>document.getElementById(id);
const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
let user=null,projects=[],photos=[],activeProject=null,page='dashboard';
let settings={watermark_text:'TU ESTUDIO',watermark_opacity:45,watermark_size:26,watermark_repeat:true,watermark_position:'center',gallery_title:'Una historia en imágenes',gallery_color:'#927b61',gallery_font:'Playfair Display',gallery_layout:'masonry'};
let selectedFiles=[];
function toast(msg){$('toast').textContent=msg;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),4200)}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function date(v){return new Date(v).toLocaleDateString('es-ES',{day:'2-digit',month:'short',year:'numeric'})}
function slug(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
function setPage(p){page=p;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
async function authRefresh(){const {data:{session}}=await client.auth.getSession();user=session?.user||null;$('login').classList.toggle('hidden',!!user);$('app').classList.toggle('hidden',!user);if(user){$('user-email').textContent=user.email;$('welcome').textContent='Bienvenido a tu estudio';await loadProjects();}}
async function authAction(mode){const email=$('auth-email').value.trim(),password=$('auth-password').value;if(!email||!password){toast('Escribe tu correo y contraseña.');return}let r=mode==='in'?await client.auth.signInWithPassword({email,password}):await client.auth.signUp({email,password});if(r.error){toast(r.error.message);return}if(mode==='up'&&!r.data.session){toast('Cuenta creada. Revisa tu correo para confirmar el registro.');return}await authRefresh()}
async function loadProjects(){let {data,error}=await client.from(TABLE_PROJECTS).select('*').order('created_at',{ascending:false});if(error){toast('No pude cargar proyectos: '+error.message);projects=[]}else projects=data||[];render()}
async function loadPhotos(projectId){let {data,error}=await client.from(TABLE_PHOTOS).select('*').eq('project_id',projectId).order('created_at',{ascending:false});if(error){toast('No pude cargar las fotos: '+error.message);photos=[]}else{photos=data||[];for(const p of photos){if(p.preview_path){const {data:signed}=await client.storage.from(BUCKET_PREVIEWS).createSignedUrl(p.preview_path,3600);p.preview_url=signed?.signedUrl||null}}}}
function pageHead(title,sub,button=''){return `<div class="page-head"><div><h2>${title}</h2><p>${sub}</p></div>${button}</div>`}
function render(){if(!user)return;const c=$('content');
if(page==='dashboard'){c.innerHTML=pageHead('Resumen','Una vista general de tu actividad.')+`<div class="stats"><div class="stat"><span>Proyectos</span><strong>${projects.length}</strong></div><div class="stat"><span>Fotografías</span><strong>${photos.length||'—'}</strong></div><div class="stat"><span>Selecciones</span><strong>—</strong></div><div class="stat"><span>Galerías activas</span><strong>${projects.filter(p=>p.is_published).length}</strong></div></div><div class="card"><div class="row"><h3>Proyectos recientes</h3><button class="btn" data-action="projects">Ver proyectos</button></div>${projects.length?`<div class="grid">${projects.slice(0,3).map(projectCard).join('')}</div>`:`<div class="empty">Todavía no tienes proyectos.<br><button class="btn primary" style="margin-top:14px" data-action="new-project">Crear mi primer proyecto</button></div>`}</div>`}
if(page==='projects'){c.innerHTML=pageHead('Proyectos y sesiones','Crea álbumes, organiza fotografías y comparte galerías privadas.','<button class="btn primary" data-action="new-project">＋ Nuevo proyecto</button>')+(projects.length?`<div class="grid">${projects.map(projectCard).join('')}</div>`:`<div class="empty">Aún no hay proyectos. Crea uno para comenzar.</div>`)}
if(page==='watermark'){c.innerHTML=pageHead('Marca de agua','Configura la protección que se aplicará a las previsualizaciones.')+`<div class="split"><div class="card stack"><div class="field"><label>Texto de marca de agua</label><input id="wm-text" value="${esc(settings.watermark_text)}"></div><div class="field"><label>Opacidad: <b id="wm-op-val">${settings.watermark_opacity}%</b></label><input id="wm-opacity" type="range" min="5" max="100" value="${settings.watermark_opacity}"></div><div class="field"><label>Tamaño: <b id="wm-size-val">${settings.watermark_size}px</b></label><input id="wm-size" type="range" min="12" max="64" value="${settings.watermark_size}"></div><div class="field"><label>Posición</label><select id="wm-position"><option value="center">Centro</option><option value="bottom">Inferior</option><option value="top">Superior</option></select></div><label><input id="wm-repeat" type="checkbox" style="width:auto" ${settings.watermark_repeat?'checked':''}> Repetir en toda la fotografía</label><div class="field"><label>Logotipo PNG (opcional)</label><input id="wm-logo" type="file" accept="image/png"></div><button class="btn primary" data-action="save-watermark">Guardar configuración</button><p class="muted" style="font-size:11px">La marca se incrusta en las previsualizaciones JPG/PNG generadas en el navegador. Los RAW se guardan como originales y requieren un procesador del servidor para generar sus vistas previas.</p></div><div class="card"><h3>Previsualización en vivo</h3><div class="preview-box"><div class="photo" id="wm-preview"><img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=900" alt="Ejemplo de retrato"><div class="wm" id="wm-preview-text"></div></div></div><p class="muted" style="font-size:11px;margin:12px 0 0">Ejemplo visual de la marca de agua sobre una fotografía.</p></div></div>`;updateWatermarkPreview()}
if(page==='design'){c.innerHTML=pageHead('Diseño de galería','Personaliza la experiencia que verá cada cliente.')+`<div class="split"><div class="card stack"><div class="field"><label>Título principal</label><input id="design-title" value="${esc(settings.gallery_title)}"></div><div class="field"><label>Tipografía</label><select id="design-font"><option>Playfair Display</option><option>DM Sans</option><option>Cormorant Garamond</option></select></div><div class="field"><label>Color de acento</label><input id="design-color" type="color" value="${settings.gallery_color}"></div><div class="field"><label>Distribución</label><select id="design-layout"><option value="masonry">Mosaico</option><option value="grid">Cuadrícula</option><option value="columns">Columnas</option></select></div><button class="btn primary" data-action="save-design">Guardar diseño</button></div><div class="card"><h3>Previsualización</h3><div class="preview-box" id="design-preview"><div style="text-align:center;padding:30px 8px"><div class="eyebrow">GALERÍA PRIVADA</div><div id="design-preview-title" style="font:500 27px 'Playfair Display',serif;margin:10px">${esc(settings.gallery_title)}</div><div class="muted" style="font-size:11px">Una colección especial para ti</div></div><div class="grid" style="grid-template-columns:repeat(2,1fr)"><img style="width:100%;border-radius:7px" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500"><img style="width:100%;border-radius:7px" src="https://images.unsplash.com/photo-1519741497674-611481863552?w=500"></div></div></div></div>`}
if(page==='activity'){c.innerHTML=pageHead('Selecciones y comentarios','Las elecciones de tus clientes aparecerán aquí cuando habilitemos la galería compartida.')+`<div class="notice">El panel de selección depende de las tablas y funciones seguras de galería pública. No se debe permitir que un visitante anónimo consulte directamente las tablas privadas del fotógrafo. Se habilita mediante funciones RPC con token de galería en la siguiente fase.</div>`}
}
function projectCard(p){return `<article class="card project"><div class="cover">${p.cover_url?`<img src="${esc(p.cover_url)}">`:`<div style="height:100%;display:grid;place-items:center;color:var(--muted);font:22px 'Playfair Display',serif">atelier.</div>`}</div><div class="project-info"><div class="row"><strong>${esc(p.title)}</strong><span class="badge">${p.is_published?'Publicado':'Privado'}</span></div><small>${date(p.created_at)} · ${esc(p.description||'Sesión fotográfica')}</small><div class="row" style="margin-top:13px"><button class="btn soft" data-action="open-project" data-id="${p.id}">Abrir álbum</button><button class="btn" data-action="share-project" data-id="${p.id}">Compartir</button></div></div></article>`}
async function createProject(){const title=prompt('Nombre del proyecto o sesión:');if(!title?.trim())return;const description=prompt('Descripción (opcional):')||'';const {data,error}=await client.from(TABLE_PROJECTS).insert({user_id:user.id,title:title.trim(),description,share_token:crypto.randomUUID(),is_published:false}).select().single();if(error){toast('No se pudo crear: '+error.message);return}projects.unshift(data);toast('Proyecto creado.');render()}
async function openProject(id){activeProject=projects.find(p=>String(p.id)===String(id));if(!activeProject)return;await loadPhotos(id);page='album';document.querySelectorAll('[data-page]').forEach(b=>b.classList.remove('active'));renderAlbum()}
function renderAlbum(){const c=$('content');c.innerHTML=`<div class="page-head"><div><button class="btn" data-action="projects">← Proyectos</button><h2 style="margin-top:14px">${esc(activeProject.title)}</h2><p>${esc(activeProject.description||'Galería del proyecto')}</p></div><div class="toolbar"><button class="btn" data-action="toggle-publish">${activeProject.is_published?'Despublicar':'Publicar galería'}</button><button class="btn primary" data-action="upload">＋ Subir fotografías</button></div></div><div class="notice" style="margin-bottom:16px">Los archivos originales se guardan en un bucket privado. Los JPG/PNG generan una copia de visualización con marca de agua. La orientación se detecta automáticamente leyendo las dimensiones de cada imagen.</div><div class="row" style="margin-bottom:12px"><h3>Fotografías (${photos.length})</h3><span class="badge">RAW · JPG · PNG · WEBP</span></div>${photos.length?`<div class="photos">${photos.map(photoCard).join('')}</div>`:`<div class="empty">Este álbum está vacío.<br><button class="btn primary" data-action="upload" style="margin-top:12px">Subir primeras fotografías</button></div>`}<div id="upload-progress" class="muted" style="font-size:12px;margin-top:12px"></div>`}
function photoCard(p){return `<div><div class="photo"><img src="${esc(p.preview_url||'')}" alt="${esc(p.file_name)}" loading="lazy"><div class="wm" style="opacity:${settings.watermark_opacity/100};font-size:${settings.watermark_size}px">${esc(settings.watermark_text)}</div></div><div class="photo-meta row"><span>${esc(p.file_name)}</span><span class="badge">${esc(p.orientation||'—')}</span></div></div>`}
function updateWatermarkPreview(){const text=$('wm-preview-text');if(!text)return;text.textContent=$('wm-text')?.value||settings.watermark_text;text.style.opacity=($('wm-opacity')?.value||settings.watermark_opacity)/100;text.style.fontSize=($('wm-size')?.value||settings.watermark_size)+'px';text.style.alignItems='center';text.style.justifyContent='center';if($('wm-position')?.value==='bottom')text.style.alignItems='end';if($('wm-position')?.value==='top')text.style.alignItems='start';text.style.padding='15px';text.style.background=$('wm-repeat')?.checked?'repeating-linear-gradient( -25deg,transparent 0 90px,rgba(0,0,0,.0) 90px 120px)':'none'}
async function saveWatermark(){settings.watermark_text=$('wm-text').value;settings.watermark_opacity=+$('wm-opacity').value;settings.watermark_size=+$('wm-size').value;settings.watermark_repeat=$('wm-repeat').checked;settings.watermark_position=$('wm-position').value;toast('Configuración aplicada a las próximas previsualizaciones.')}
function applyWatermark(bitmap){const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');canvas.width=bitmap.width;canvas.height=bitmap.height;ctx.drawImage(bitmap,0,0);const text=settings.watermark_text||'TU ESTUDIO',size=Math.max(16,Math.round(canvas.width*settings.watermark_size/900));ctx.save();ctx.globalAlpha=settings.watermark_opacity/100;ctx.fillStyle='#fff';ctx.strokeStyle='#0008';ctx.lineWidth=Math.max(1,size*.035);ctx.font=`600 ${size}px DM Sans, sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';if(settings.watermark_repeat){ctx.translate(canvas.width/2,canvas.height/2);ctx.rotate(-Math.PI/7);const stepX=Math.max(180,canvas.width*.42),stepY=Math.max(100,canvas.height*.24);for(let y=-canvas.height;y<canvas.height;y+=stepY)for(let x=-canvas.width;x<canvas.width;x+=stepX){ctx.strokeText(text,x,y);ctx.fillText(text,x,y)}}else{let y=settings.watermark_position==='top'?size*2:settings.watermark_position==='bottom'?canvas.height-size*2:canvas.height/2;ctx.strokeText(text,canvas.width/2,y);ctx.fillText(text,canvas.width/2,y)}ctx.restore();return new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',.88))}
async function detectImage(file){try{const bmp=await createImageBitmap(file);const width=bmp.width,height=bmp.height;bmp.close();return {width,height,orientation:width>height?'Horizontal':height>width?'Vertical':'Cuadrada'}}catch{return {width:null,height:null,orientation:'RAW / pendiente de procesar'}}}
async function uploadFiles(){const input=document.createElement('input');input.type='file';input.multiple=true;input.accept='image/*,.arw,.cr2,.cr3,.nef,.dng,.raf,.orf,.rw2';input.onchange=async()=>{const files=Array.from(input.files||[]);if(!files.length)return;const status=$('upload-progress');for(let i=0;i<files.length;i++){const f=files[i];status.textContent=`Subiendo ${i+1} de ${files.length}: ${f.name}`;const meta=await detectImage(f);const ext=(f.name.split('.').pop()||'bin').toLowerCase();const path=`${user.id}/${activeProject.id}/${crypto.randomUUID()}-${slug(f.name)}`;const {error:upErr}=await client.storage.from(BUCKET_ORIGINALS).upload(path,f,{upsert:false,contentType:f.type||'application/octet-stream'});if(upErr){toast(`Error con ${f.name}: ${upErr.message}`);continue}
let previewPath=null,previewUrl=null;
if(['jpg','jpeg','png','webp'].includes(ext)){try{const bmp=await createImageBitmap(f);const blob=await applyWatermark(bmp);bmp.close();previewPath=`${user.id}/${activeProject.id}/${crypto.randomUUID()}.jpg`;const {error:pe}=await client.storage.from(BUCKET_PREVIEWS).upload(previewPath,blob,{contentType:'image/jpeg'});if(pe)throw pe;const {data:sd}=await client.storage.from(BUCKET_PREVIEWS).createSignedUrl(previewPath,3600);previewUrl=sd?.signedUrl||null}catch(e){toast('Original guardado; falló la previsualización: '+e.message)}}
const record={user_id:user.id,project_id:activeProject.id,file_name:f.name,original_path:path,preview_path:previewPath,preview_url:previewUrl,mime_type:f.type||'application/octet-stream',file_size:f.size,width:meta.width,height:meta.height,orientation:meta.orientation,processing_status:previewPath?'ready':(['jpg','jpeg','png','webp'].includes(ext)?'preview_error':'raw_pending')};
const {error:dbErr}=await client.from(TABLE_PHOTOS).insert(record);if(dbErr)toast('Archivo subido, pero no se guardaron sus datos: '+dbErr.message)}
status.textContent='Carga finalizada.';await loadPhotos(activeProject.id);renderAlbum()};input.click()}
async function togglePublish(){const next=!activeProject.is_published;const {error}=await client.from(TABLE_PROJECTS).update({is_published:next}).eq('id',activeProject.id);if(error){toast(error.message);return}activeProject.is_published=next;projects=projects.map(p=>p.id===activeProject.id?activeProject:p);toast(next?'Galería marcada como publicada.':'Galería despublicada.');renderAlbum()}
function shareProject(id){const p=projects.find(x=>String(x.id)===String(id));if(!p)return;const url=`${location.origin}${location.pathname}?gallery=${encodeURIComponent(p.share_token)}`;navigator.clipboard?.writeText(url).then(()=>toast('Enlace copiado. La vista pública requiere activar la función segura de galería.')).catch(()=>prompt('Copia el enlace:',url))}
async function saveDesign(){settings.gallery_title=$('design-title').value;settings.gallery_font=$('design-font').value;settings.gallery_color=$('design-color').value;settings.gallery_layout=$('design-layout').value;$('design-preview-title').textContent=settings.gallery_title;$('design-preview-title').style.fontFamily=settings.gallery_font;$('design-preview-title').style.color=settings.gallery_color;toast('Previsualización actualizada. La persistencia por proyecto se conecta en la siguiente fase.')}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-page]');if(nav){setPage(nav.dataset.page);return}const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(a==='projects')setPage('projects');if(a==='new-project')createProject();if(a==='open-project')openProject(b.dataset.id);if(a==='share-project')shareProject(b.dataset.id);if(a==='upload')uploadFiles();if(a==='save-watermark')saveWatermark();if(a==='save-design')saveDesign();if(a==='toggle-publish')togglePublish()});
document.addEventListener('input',e=>{if(['wm-text','wm-opacity','wm-size','wm-repeat','wm-position'].includes(e.target.id)){if(e.target.id==='wm-opacity')$('wm-op-val').textContent=e.target.value+'%';if(e.target.id==='wm-size')$('wm-size-val').textContent=e.target.value+'px';updateWatermarkPreview()}});
$('sign-in').onclick=()=>authAction('in');$('sign-up').onclick=()=>authAction('up');$('sign-out').onclick=async()=>{await client.auth.signOut();user=null;authRefresh()};$('new-project').onclick=createProject;
function toggleTheme(){document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'':'dark';localStorage.setItem('atelier-theme',document.documentElement.dataset.theme)}
$('theme').onclick=toggleTheme;$('theme-mobile').onclick=toggleTheme;
if(localStorage.getItem('atelier-theme')==='dark')document.documentElement.dataset.theme='dark';
client.auth.onAuthStateChange(()=>setTimeout(authRefresh,0));
async function routeGallery(){const token=new URLSearchParams(location.search).get('gallery');if(!token)return;toast('Enlace de galería detectado. Para habilitar la vista pública se debe desplegar el RPC seguro indicado en schema.sql.');}
routeGallery();authRefresh();
})();
</script>
